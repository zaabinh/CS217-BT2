[project]
name = "triangle-knowledge-base"
version = "1.0.0"
description = "Triangle computational network with 13 variables and 46 directed rules"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0,<3", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
triangle-kb = "triangle_knowledge_base.app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["triangle_knowledge_base*"]
exclude = ["*.tests*"]

[tool.pytest.ini_options]
testpaths = ["triangle_knowledge_base/tests"]
pythonpath = ["."]
addopts = "-ra"
